name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  intl: ^0.20.3
  shared_preferences: ^2.2.2
  connectivity_plus: ^7.3.1
  sqflite: ^2.4.4
  sqflite_common_ffi_web: ^1.0.0
  file_picker: ^13.1.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sam.png
    - assets/sam_icon_foreground.png
    - assets/sam_icon_background.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/sam.png"
  adaptive_icon_foreground: "assets/sam_icon_foreground.png"
  adaptive_icon_background: "assets/sam_icon_background.png"
  min_sdk_android: 21