<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="SAM - Student Attendance Manager">
  <meta name="theme-color" content="#0B1633">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SAM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SAM</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Our own offline service worker (see sw.js) -->
  <script>
    if ('serviceWorker' in navigator) {
      // When a new version takes over, reload once so it shows up right away.
      // If the user is busy (marking attendance / reviewing an import), wait
      // and reload as soon as they leave that screen.
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;
      var pendingReload = false;
      var busyCount = 0;
      function doReload() {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      }
      window.samSetBusy = function (busy) {
        busyCount = Math.max(0, busyCount + (busy ? 1 : -1));
        if (busyCount === 0 && pendingReload) doReload();
      };
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) return;
        if (busyCount > 0) { pendingReload = true; return; }
        doReload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('sw.js', { updateViaCache: 'none' })
          .catch(function () {});
      });
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
